<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070B" />
      <stop offset="50%" stop-color="#0B0D16" />
      <stop offset="100%" stop-color="#05060A" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg3)" />

  <!-- Ambient Light Orbs -->
  <circle cx="640" cy="360" r="340" fill="#6366F1" opacity="0.12" filter="url(#glow3)" />
  <circle cx="480" cy="280" r="200" fill="#A855F7" opacity="0.1" filter="url(#glow3)" />

  <!-- Hexagonal Isolation Chamber -->
  <g transform="translate(640, 360)">
    <polygon points="0,-220 190,-110 190,110 0,220 -190,110 -190,-110" 
             fill="#0E1220" stroke="#818CF8" stroke-width="2" filter="url(#glow3)" opacity="0.85" />
    <polygon points="0,-180 155,-90 155,90 0,180 -155,90 -155,-90" 
             fill="none" stroke="#C084FC" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.6" />

    <!-- Crystalline Circuit Traces & Memory Branches -->
    <g filter="url(#glow3)">
      <path d="M 0 0 L 120 -60 L 160 -40" fill="none" stroke="#C084FC" stroke-width="2.5" />
      <circle cx="160" cy="-40" r="4" fill="#C084FC" />

      <path d="M 0 0 L -100 -50 L -140 -20" fill="none" stroke="#818CF8" stroke-width="2.5" />
      <circle cx="-140" cy="-20" r="4" fill="#818CF8" />

      <path d="M 0 0 L 80 80 L 140 70" fill="none" stroke="#38BDF8" stroke-width="2.5" />
      <circle cx="140" cy="70" r="4" fill="#38BDF8" />

      <path d="M 0 0 L -80 70 L -120 120" fill="none" stroke="#A855F7" stroke-width="2.5" />
      <circle cx="-120" cy="120" r="4" fill="#A855F7" />
    </g>

    <!-- Center Processor Core: Code Mode Engine -->
    <rect x="-65" y="-35" width="130" height="70" rx="10" fill="#181B2F" stroke="#C084FC" stroke-width="2" filter="url(#glow3)" />
    <text x="0" y="-8" font-family="monospace" font-size="12" font-weight="bold" fill="#F5F4F0" text-anchor="middle">CODEMODE</text>
    <text x="0" y="16" font-family="monospace" font-size="10" fill="#A855F7" text-anchor="middle">V8 ISOLATE</text>
  </g>

  <!-- Typography overlay / HUD -->
  <text x="80" y="110" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#F5F4F0" letter-spacing="-0.02em">
    SPIKE LAND // DURABLE CODE MODE
  </text>
  <text x="80" y="140" font-family="monospace" font-weight="600" font-size="14" fill="#C084FC" letter-spacing="0.1em">
    STATEFUL ASYNC WORKFLOWS • APPROVAL CHECKPOINTS • ZERO ROUNDTRIPS
  </text>

  <!-- Status Badges -->
  <rect x="80" y="600" width="240" height="38" rx="6" fill="#111322" stroke="#818CF8" stroke-width="1.2" />
  <circle cx="102" cy="619" r="5" fill="#C084FC" />
  <text x="120" y="624" font-family="monospace" font-size="12" fill="#F5F4F0" font-weight="bold">RUNTIME: @cloudflare/codemode</text>

  <rect x="340" y="600" width="220" height="38" rx="6" fill="#111322" stroke="#A855F7" stroke-width="1.2" />
  <circle cx="362" cy="619" r="5" fill="#38BDF8" />
  <text x="380" y="624" font-family="monospace" font-size="12" fill="#F5F4F0" font-weight="bold">ISOLATE LIFETIME: PERSISTENT</text>
</svg>
