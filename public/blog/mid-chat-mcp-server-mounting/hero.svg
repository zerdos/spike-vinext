<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0E" />
      <stop offset="60%" stop-color="#0E121A" />
      <stop offset="100%" stop-color="#06080B" />
    </linearGradient>
    <linearGradient id="sapphireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="emeraldSparks" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg2)" />

  <!-- Ambient Light -->
  <circle cx="640" cy="380" r="350" fill="#0284C7" opacity="0.1" filter="url(#glow2)" />
  <circle cx="780" cy="340" r="220" fill="#10B981" opacity="0.08" filter="url(#glow2)" />

  <!-- Isometric Cybernetic Docking Bay Frame -->
  <g transform="translate(640, 360)">
    <!-- Base Core Platform -->
    <polygon points="-360,0 0,-180 360,0 0,180" fill="#111622" stroke="#1E293B" stroke-width="2" />
    <polygon points="-360,0 -360,40 0,220 0,180" fill="#0A0E17" stroke="#1E293B" stroke-width="2" />
    <polygon points="0,180 0,220 360,40 360,0" fill="#070A10" stroke="#1E293B" stroke-width="2" />

    <!-- Docking Chamber / Quantum Processor Core -->
    <polygon points="-160,0 0,-80 160,0 0,80" fill="#0F172A" stroke="#0284C7" stroke-width="2" filter="url(#glow2)" />
    
    <!-- Pulse Ring -->
    <polygon points="-220,0 0,-110 220,0 0,110" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.7" />

    <!-- Sapphire MCP Cartridge Sliding in without reboot -->
    <g transform="translate(-80, -90)">
      <polygon points="-100,0 0,-50 100,0 0,50" fill="url(#sapphireGrad)" stroke="#38BDF8" stroke-width="2" filter="url(#glow2)" />
      <polygon points="-100,0 -100,35 0,85 0,50" fill="#0369A1" stroke="#38BDF8" stroke-width="1.5" />
      <polygon points="0,50 0,85 100,35 100,0" fill="#075985" stroke="#38BDF8" stroke-width="1.5" />
      <text x="-55" y="15" font-family="monospace" font-size="13" font-weight="bold" fill="#FFFFFF" transform="rotate(-15)">MCP SERVER</text>
    </g>

    <!-- Emerald Connection Sparks & Data Channels -->
    <g filter="url(#glow2)">
      <circle cx="-30" cy="-20" r="5" fill="#34D399" />
      <circle cx="20" cy="-40" r="4" fill="#6EE7B7" />
      <circle cx="60" cy="10" r="6" fill="#10B981" />
      <line x1="-30" y1="-20" x2="60" y2="10" stroke="#34D399" stroke-width="2" />
      <line x1="20" y1="-40" x2="-100" y2="-70" stroke="#6EE7B7" stroke-width="1.5" stroke-dasharray="4,3" />
    </g>
  </g>

  <!-- HUD Overlay -->
  <text x="80" y="110" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#F5F4F0" letter-spacing="-0.02em">
    SPIKE LAND // EDGE RUNTIME
  </text>
  <text x="80" y="140" font-family="monospace" font-weight="600" font-size="14" fill="#38BDF8" letter-spacing="0.1em">
    DYNAMIC SERVER MOUNTING • ZERO RESTART • 100% IN-BAND
  </text>

  <!-- Badges -->
  <rect x="80" y="600" width="220" height="38" rx="6" fill="#111622" stroke="#0284C7" stroke-width="1.2" />
  <circle cx="102" cy="619" r="5" fill="#38BDF8" />
  <text x="120" y="624" font-family="monospace" font-size="12" fill="#F5F4F0" font-weight="bold">METHOD: mount_mcp_server</text>

  <rect x="320" y="600" width="240" height="38" rx="6" fill="#111622" stroke="#10B981" stroke-width="1.2" />
  <circle cx="342" cy="619" r="5" fill="#10B981" />
  <text x="360" y="624" font-family="monospace" font-size="12" fill="#F5F4F0" font-weight="bold">CLIENT RESTART: 0 SECONDS</text>
</svg>
