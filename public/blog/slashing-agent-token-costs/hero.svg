<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090B" />
      <stop offset="50%" stop-color="#0A0E14" />
      <stop offset="100%" stop-color="#050709" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0070F3" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#00FFA3" stop-opacity="1" />
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="amberDeflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFAA00" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FF2200" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1A222D" stroke-width="0.8" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)" />
  <rect width="1280" height="720" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="420" cy="360" r="320" fill="#0070F3" opacity="0.12" filter="url(#glow)" />
  <circle cx="880" cy="280" r="240" fill="#00F0FF" opacity="0.08" filter="url(#glow)" />
  <circle cx="950" cy="480" r="180" fill="#FF5500" opacity="0.08" filter="url(#glow)" />

  <!-- Laser Beam passing across position zero undisturbed -->
  <path d="M 60 360 L 1220 360" stroke="url(#laserBeam)" stroke-width="4" filter="url(#glow)" />
  <path d="M 60 360 L 1220 360" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8" />

  <!-- Hexagonal Glass Shield -->
  <polygon points="640,180 780,260 780,460 640,540 500,460 500,260" 
           fill="#0A111E" fill-opacity="0.75" stroke="#00F0FF" stroke-width="2.5" stroke-opacity="0.6" filter="url(#glow)" />
  <polygon points="640,210 750,275 750,445 640,510 530,445 530,275" 
           fill="none" stroke="#00FFA3" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6,4" />

  <!-- Stacked Immutable Position Zero Cache Blocks -->
  <g transform="translate(340, 240)">
    <!-- Block 1 -->
    <polygon points="0,60 120,0 240,60 120,120" fill="url(#cyanGlow)" stroke="#00F0FF" stroke-width="2" />
    <polygon points="0,60 0,90 120,150 120,120" fill="#0047BB" stroke="#00F0FF" stroke-width="1.5" />
    <polygon points="120,120 120,150 240,90 240,60" fill="#002D7A" stroke="#00F0FF" stroke-width="1.5" />
    
    <!-- Block 2 -->
    <g transform="translate(0, -50)">
      <polygon points="0,60 120,0 240,60 120,120" fill="url(#cyanGlow)" stroke="#00FFA3" stroke-width="2" filter="url(#glow)" />
      <polygon points="0,60 0,90 120,150 120,120" fill="#005A9E" stroke="#00FFA3" stroke-width="1.5" />
      <polygon points="120,120 120,150 240,90 240,60" fill="#003566" stroke="#00FFA3" stroke-width="1.5" />
    </g>

    <!-- Block 3 -->
    <g transform="translate(0, -100)">
      <polygon points="0,60 120,0 240,60 120,120" fill="#E6FFFA" fill-opacity="0.9" stroke="#00FFA3" stroke-width="2" />
      <polygon points="0,60 0,80 120,140 120,120" fill="#00A389" stroke="#00FFA3" stroke-width="1.5" />
      <polygon points="120,120 120,140 240,80 240,60" fill="#006655" stroke="#00FFA3" stroke-width="1.5" />
    </g>
  </g>

  <!-- Deflected Chaotic Amber JSON Stream -->
  <g filter="url(#glow)">
    <path d="M 1120 220 Q 820 260 760 320 Q 800 180 960 140" fill="none" stroke="url(#amberDeflect)" stroke-width="3" stroke-dasharray="8,6" />
    <path d="M 1160 360 Q 820 370 780 410 Q 850 500 1020 520" fill="none" stroke="url(#amberDeflect)" stroke-width="3.5" stroke-dasharray="10,6" />
    <path d="M 1140 460 Q 830 440 770 480 Q 820 580 960 620" fill="none" stroke="url(#amberDeflect)" stroke-width="2.5" />
  </g>

  <!-- Typography overlay / HUD -->
  <text x="80" y="110" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#F5F4F0" letter-spacing="-0.02em">
    SPIKE LAND // ARCHITECTURE
  </text>
  <text x="80" y="140" font-family="monospace" font-weight="600" font-size="14" fill="#00FFA3" letter-spacing="0.1em">
    POSITION ZERO PREFIX CACHE: 100% HIT RATE [98.7% COST REDUCTION]
  </text>

  <!-- Status Badges -->
  <rect x="80" y="600" width="240" height="38" rx="6" fill="#11161F" stroke="#00F0FF" stroke-width="1.2" opacity="0.9" />
  <circle cx="102" cy="619" r="5" fill="#00FFA3" />
  <text x="120" y="624" font-family="monospace" font-size="12" fill="#F5F4F0" font-weight="bold">BROKER TOKENS: 5 FIXED</text>

  <rect x="340" y="600" width="260" height="38" rx="6" fill="#11161F" stroke="#30363D" stroke-width="1.2" opacity="0.9" />
  <circle cx="362" cy="619" r="5" fill="#0070F3" />
  <text x="380" y="624" font-family="monospace" font-size="12" fill="#B8BDC7">PREFIX CACHE: PRESERVED</text>
</svg>
